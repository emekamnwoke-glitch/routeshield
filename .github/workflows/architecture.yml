name: Architecture governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  traceability:
    name: Traceability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check model against architecture documents and verify rendered matrix
        run: python tools/traceability/check.py --verify-rendered
      - name: Check Markdown links and anchors
        run: python tools/docs/check_links.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
